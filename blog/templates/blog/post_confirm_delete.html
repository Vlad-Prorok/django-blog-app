{% extends 'base.html' %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<h2>Удалить статью?</h2>
<p>Вы уверены, что хотите удалить статью <strong>"{{ article.title }}"</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'post_detail' pk=article.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
